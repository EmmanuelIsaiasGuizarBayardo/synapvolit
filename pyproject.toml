[project]
name = "synapvolit"
version = "0.1.0"
description = "Motor de adquisición, procesamiento y decodificación de sEMG para aplicaciones de DUNNE."
readme = "README.md"
requires-python = ">=3.12"

# Sin pines de version: uv.lock fija la resolucion exacta.
dependencies = [
    "mne",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pandas",
    "pyyaml",
    "ipykernel",
    "wfdb>=4.3.1",
    "websockets>=17.2",
    "pyserial>=3.5",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pyyaml",
    "cobs>=1.2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapvolit"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "NPY"]

[tool.pytest.ini_options]
testpaths = ["tests"]
